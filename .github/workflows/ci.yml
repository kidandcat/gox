name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: ci (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum toolchain from go.mod. 1.25 is out of support and its stdlib
        # has GO-2026-4602, which is fixed in 1.26.8. The second cell tracks
        # the current stable release.
        go: ['1.26.8', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gox check (self-dogfood)
        run: go run ./cmd/gox check --all ./...

      - name: test (race)
        run: go test -race ./...

      # Linters run via `go run tool@version` so they never enter go.mod
      # (the module stays dependency-free).
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
